name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm v11+ はパッケージのインストールスクリプトをブロックするため、
      # Electron本体のバイナリがダウンロードされない。手動で取得する。
      - name: Download Electron binary
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node node_modules/electron/install.js

      - name: Build Windows installer
        id: build
        env:
          # CIからのElectron/NSISダウンロードを高速・安定化（npmmirror経由）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build-log.txt

      # 失敗時：ログ末尾をIssueとして自動作成（公開リポジトリなのでAPIで読める）
      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "Release build failed on \`${{ github.ref_name }}\`"
            echo ""
            echo '```'
            tail -n 80 build-log.txt
            echo '```'
          } > issue-body.md
          gh issue create --title "Release build failed: ${{ github.ref_name }}" --body-file issue-body.md

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $pre = "false"
          } else {
            $tag = "nightly-" + (Get-Date -Format "yyyyMMdd-HHmm")
            $pre = "true"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AI Novelist Studio ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/AI Novelist Studio Setup *.exe
            dist/win-unpacked/AI Novelist Studio.exe
